[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firex-workspace-smoke"
version = "0.0.0"
description = "Temporary build validation member for the FireX OSS workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.firex.workspace-validation]
module-roots = ["firex_workspace_smoke"]
