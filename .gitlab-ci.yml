variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_PYTHON: "3.10"
  UV_PYTHON_DOWNLOADS: "never"
  UV_SYNC_ARGS: ""
  firex_base_logging_dir: "$CI_PROJECT_DIR/flow_test_results"

cache:
  paths:
    - .cache/uv/

stages:
  - build
  - build-firexkit-from-tip
  - workspace
  - test
  - upload
  - update-docs

default:
  image: firexstuff/firex-alpine-build:3.10.20-uv0.11.19
  before_script:
    - git config --global --add safe.directory /builds/FireXStuff/firexapp
    - uv --version
    - uv sync --locked $UV_SYNC_ARGS

build:
  stage: build
  variables:
    UV_SYNC_ARGS: "--group release --no-sources"
  script:
    - uv build --clear --no-create-gitignore
    - uv run --locked --group release twine check dist/*
  artifacts:
    paths:
      - dist/

build-firexkit-from-tip:
  stage: build-firexkit-from-tip
  variables:
    UV_SYNC_ARGS: "--all-extras"
  script:
    - uv pip install --python .venv/bin/python git+https://gitlab.com/FireXStuff/firexkit.git
    - uv pip check --python .venv/bin/python
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

workspace-selected-member:
  stage: workspace
  variables:
    UV_SYNC_ARGS: "--all-packages --group workspace-ci"
    UV_WORKSPACE_PACKAGE: "firex-workspace-smoke"
    UV_WORKSPACE_PATH: "packages/workspace-smoke"
  script:
    - uv run --locked --all-packages --group workspace-ci ruff check "$UV_WORKSPACE_PATH" tools/validate_workspace_artifacts.py
    - uv run --locked --all-packages --group workspace-ci ruff format --check "$UV_WORKSPACE_PATH" tools/validate_workspace_artifacts.py
    - uv run --locked --package "$UV_WORKSPACE_PACKAGE" python -m unittest discover -s "$UV_WORKSPACE_PATH/tests" -p "*_tests.py"
    - uv build --package "$UV_WORKSPACE_PACKAGE" --out-dir workspace-selected-dist --clear --no-create-gitignore
    - uv run --locked --all-packages --group workspace-ci python tools/validate_workspace_artifacts.py workspace-selected-dist --package "$UV_WORKSPACE_PACKAGE"
  artifacts:
    paths:
      - workspace-selected-dist/
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - packages/**/*
        - tools/validate_workspace_artifacts.py
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml

workspace-all-members:
  stage: workspace
  variables:
    UV_SYNC_ARGS: "--all-packages --group workspace-ci"
  script:
    - uv lock --check
    - uv sync --locked --package firexapp --group workspace-ci
    - uv sync --locked --all-packages --group workspace-ci
    - uv sync --locked --all-packages --group workspace-ci --no-sources
    - uv build --all-packages --out-dir workspace-dist --clear --no-create-gitignore --no-sources
    - uv run --locked --all-packages --group workspace-ci python tools/validate_workspace_artifacts.py workspace-dist
  artifacts:
    paths:
      - workspace-dist/
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - packages/**/*
        - tools/validate_workspace_artifacts.py
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml

build-docs:
  stage:  test
  variables:
    UV_SYNC_ARGS: "--group docs"
  script:
    - uv run --locked --group docs sphinx-build -b html docs html
  artifacts:
    paths:
      - html/

test-unit:
  stage: test
  variables:
    UV_SYNC_ARGS: "--group test --extra test"
  script:
    - uv run --locked --group test --extra test coverage run -m unittest discover -s tests/unit_tests -p "*_tests.py"
  artifacts:
    paths:
      - .coverage

test-integration:
  stage: test
  variables:
    UV_SYNC_ARGS: "--group integration --all-extras"
  script:
    - uv run --locked --group integration --all-extras firexapp submit --sync --chain nop
    - uv run --locked --group integration --all-extras firexapp submit --chain RunAllIntegrationTests --public_runs True --install_configs cloud-ci-install-configs.json --sync --coverage False --max_parallel_tests 5
  artifacts:
    paths:
      - flow_test_results/
    when: always

upload-pkg:
  stage: upload
  variables:
    UV_SYNC_ARGS: "--group release"
  script:
    - uv run --locked --group release twine check dist/*
    - uv run --locked --group release twine upload --verbose --username __token__ dist/*
  only:
    - tags

upload-results:
  inherit:
    default: false
  stage: upload
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -e -r $firex_base_logging_dir  gs://runs.firexflame.com
  when: always

update-docs:
  inherit:
    default: false
  stage: update-docs
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -r html gs://www.firexstuff.com/firexapp
  needs:
    - upload-pkg
    - build-docs
  only:
    - tags
