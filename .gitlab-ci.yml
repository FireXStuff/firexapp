variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_PYTHON: "3.10"
  UV_PYTHON_DOWNLOADS: "never"
  UV_SYNC_ARGS: ""
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  firex_base_logging_dir: "$CI_PROJECT_DIR/flow_test_results"

cache:
  paths:
    - .cache/uv/
    - .cache/npm/

stages:
  - build
  - test
  - upload
  - update-docs

default:
  image: firexstuff/firex-alpine-build:3.10.20-uv0.11.19
  before_script:
    - git config --global --add safe.directory /builds/FireXStuff/firexapp
    - uv --version
    - uv sync --locked $UV_SYNC_ARGS

build:
  stage: build
  variables:
    UV_SYNC_ARGS: "--group release --no-sources"
  script:
    - npm config set "@fortawesome:registry" https://npm.fontawesome.com/
    - npm config set "//npm.fontawesome.com/:_authToken" "$FONTAWESOME_TOKEN"
    - npm --prefix firex_flame_ui_frontend ci
    - npm --prefix firex_flame_ui_frontend run build
    # Preserve the standalone UI pipeline's effective gate. Its unit suite was
    # already disabled pending replacement of the old Jest-specific mocks.
    - npm --prefix firex_flame_ui_frontend run lint
    - uv build --clear --no-create-gitignore
    - uv run --locked --group release twine check dist/*
  artifacts:
    paths:
      - dist/
      - firex_flame_ui/

build-docs:
  stage:  test
  variables:
    UV_SYNC_ARGS: "--group docs"
  script:
    - uv run --locked --group docs sphinx-build -b html docs html
  artifacts:
    paths:
      - html/

test-unit:
  stage: test
  variables:
    UV_SYNC_ARGS: "--group test --extra test"
  script:
    - uv run --locked --group test --extra test coverage run -m unittest discover -s tests/unit_tests -p "*_tests.py"
    # FireXKit tests define intentionally invalid Celery tasks. Run them in a
    # separate process so their global registrations cannot affect app tests.
    - uv run --locked --group test --extra test coverage run --append -m unittest discover -s tests/firexkit_unit_tests -p "*_tests.py"
    - uv run --locked --group test --extra test coverage run --append -m unittest discover -s tests/firex_flame_unit_tests -p "*_tests.py"
  artifacts:
    paths:
      - .coverage

test-artifact:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - uv venv --python "$UV_PYTHON" .artifact-venv
    - uv pip install --python .artifact-venv/bin/python dist/*.whl
    - uv pip check --python .artifact-venv/bin/python
    - .artifact-venv/bin/python -I tools/validate_consolidated_artifact.py
    - .artifact-venv/bin/firex_blaze --help > /dev/null
    - .artifact-venv/bin/firex_flame --help > /dev/null
    - .artifact-venv/bin/firex_keeper --help > /dev/null

test-integration:
  stage: test
  variables:
    UV_SYNC_ARGS: "--group integration --all-extras"
  script:
    # FlameLiveMonitorRemoteFile deliberately exercises Flame's SSH-based
    # remote log streaming against this container.
    - sudo /usr/sbin/sshd
    - uv run --locked --group integration --all-extras firexapp submit --sync --chain nop
    - uv run --locked --group integration --all-extras firexapp submit --chain RunAllIntegrationTests --public_runs True --install_configs cloud-ci-install-configs.json --sync --coverage False --max_parallel_tests 5
  artifacts:
    paths:
      - flow_test_results/
    when: always

upload-pkg:
  stage: upload
  variables:
    UV_SYNC_ARGS: "--group release"
  script:
    - uv run --locked --group release twine check dist/*
    - uv run --locked --group release twine upload --verbose --username __token__ dist/*
  only:
    - tags

upload-results:
  inherit:
    default: false
  stage: upload
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -e -r $firex_base_logging_dir  gs://runs.firexflame.com
  when: always

deploy-flame-ui:
  inherit:
    default: false
  stage: upload
  image: google/cloud-sdk
  dependencies:
    - build
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -r firex_flame_ui gs://www.firexstuff.com$DEPLOY_PATH
    - gsutil mv gs://www.firexstuff.com$DEPLOY_PATH/public-flame-ui-config.json gs://www.firexstuff.com$DEPLOY_PATH/flame-ui-config.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        DEPLOY_PATH: /flame/$CI_JOB_ID
    - if: $CI_COMMIT_TAG
      variables:
        DEPLOY_PATH: /flame

update-docs:
  inherit:
    default: false
  stage: update-docs
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -r html gs://www.firexstuff.com/firexapp
  needs:
    - upload-pkg
    - build-docs
  only:
    - tags
