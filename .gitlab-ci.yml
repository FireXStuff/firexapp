variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_PYTHON: "3.10"
  UV_PYTHON_DOWNLOADS: "never"
  UV_SYNC_ARGS: ""
  firex_base_logging_dir: "$CI_PROJECT_DIR/flow_test_results"

cache:
  paths:
    - .cache/uv/

stages:
  - build
  - build-firexkit-from-tip
  - test
  - upload
  - update-docs

default:
  image: firexstuff/firex-alpine-build:3.10.20-uv0.11.19
  before_script:
    - git config --global --add safe.directory /builds/FireXStuff/firexapp
    - uv --version
    - uv sync --locked $UV_SYNC_ARGS

build:
  stage: build
  variables:
    UV_SYNC_ARGS: "--group release --no-sources"
  script:
    - uv build --clear --no-create-gitignore
    - uv run --locked --group release twine check dist/*
  artifacts:
    paths:
      - dist/

# Keep the previous builder as a comparison and rollback path during Phase 1.
# The uv-built artifacts above are the only artifacts eligible for upload.
build-legacy:
  stage: build
  variables:
    UV_SYNC_ARGS: "--group build-legacy --all-extras"
  script:
    - uv run --locked --group build-legacy --all-extras firex-build build --install_test_reqs --install_flame
    - mv dist legacy-dist
  artifacts:
    paths:
      - legacy-dist/

build-firexkit-from-tip:
  stage: build-firexkit-from-tip
  variables:
    UV_SYNC_ARGS: "--all-extras"
  script:
    - uv pip install --python .venv/bin/python git+https://gitlab.com/FireXStuff/firexkit.git
    - uv pip check --python .venv/bin/python
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

build-docs:
  stage:  test
  variables:
    UV_SYNC_ARGS: "--group docs"
  script:
    - uv run --locked --group docs firex-build docs
  artifacts:
    paths:
      - html/

test-unit:
  stage: test
  variables:
    UV_SYNC_ARGS: "--group test --extra test"
  script:
    - uv run --locked --group test --extra test firex-build unit_tests
  artifacts:
    paths:
      - .coverage

test-integration:
  stage: test
  variables:
    UV_SYNC_ARGS: "--group integration --all-extras"
  script:
    - uv run --locked --group integration --all-extras firexapp submit --sync --chain nop
    - uv run --locked --group integration --all-extras firexapp submit --chain RunAllIntegrationTests --public_runs True --install_configs cloud-ci-install-configs.json --sync --coverage False --max_parallel_tests 5
  artifacts:
    paths:
      - flow_test_results/
    when: always

compare-build-artifacts:
  stage: test
  needs:
    - job: build
      artifacts: true
    - job: build-legacy
      artifacts: true
  script:
    - uv run --locked python tools/compare_build_artifacts.py legacy-dist dist

upload-pkg:
  stage: upload
  variables:
    UV_SYNC_ARGS: "--group release"
  script:
    - uv run --locked --group release twine check dist/*
    - uv run --locked --group release firex-build upload_pip
  only:
    - tags

upload-results:
  inherit:
    default: false
  stage: upload
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -e -r $firex_base_logging_dir  gs://runs.firexflame.com
  when: always

update-docs:
  inherit:
    default: false
  stage: update-docs
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -r html gs://www.firexstuff.com/firexapp
  needs:
    - upload-pkg
    - build-docs
  only:
    - tags
