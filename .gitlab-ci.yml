variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_PYTHON_DOWNLOADS: "never"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  firex_base_logging_dir: "$CI_PROJECT_DIR/flow_test_results"

cache:
  paths:
    - .cache/uv/
    - .cache/npm/

stages:
  - build
  - test
  - upload
  - update-docs

default:
  image: firexstuff/firex-alpine-build:3.10.20-uv0.11.19
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - uv --version

build:
  stage: build
  script:
    - uv run --locked python tools/validate_version.py
    - npm --prefix firex_flame_ui_frontend ci
    # Validate without auto-fixing tracked sources in the release workspace.
    # The frontend unit suite remains disabled pending replacement of its
    # Jest-specific mocks.
    - npm --prefix firex_flame_ui_frontend run lint-no-fix
    # Vite replaces the checked-in fallback UI and stamps the static project
    # version plus the exact Git commit into the consolidated artifact.
    - npm --prefix firex_flame_ui_frontend run build
    - uv run --locked python tools/validate_version.py --generated-ui
    # Build with publishable metadata only; local/workspace source overrides
    # must never be required to produce the release artifacts.
    - uv build --clear --no-create-gitignore --no-sources
    - uv run --locked --group release twine check dist/*
    # Keep generated deploy files outside their tracked package path when
    # GitLab overlays artifacts onto downstream clean checkouts.
    - mkdir -p ci_artifacts
    - cp -R firex_flame_ui ci_artifacts/
  artifacts:
    paths:
      - dist/
      - ci_artifacts/firex_flame_ui/

build-docs:
  stage: test
  script:
    - uv run --locked --group docs sphinx-build -b html docs html
  artifacts:
    paths:
      - html/

test-unit:
  stage: test
  script:
    - uv run --locked --group test coverage run -m unittest discover -s tests/unit_tests -p "*_tests.py"
    # FireXKit tests define intentionally invalid Celery tasks. Run them in a
    # separate process so their global registrations cannot affect app tests.
    - uv run --locked --group test coverage run --append -m unittest discover -s tests/firexkit_unit_tests -p "*_tests.py"
    - uv run --locked --group test coverage run --append -m unittest discover -s tests/firex_flame_unit_tests -p "*_tests.py"
  artifacts:
    paths:
      - .coverage

test-artifact:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    # .python-version is the single Python request for this project.
    - uv venv .artifact-venv
    - uv pip install --python .artifact-venv/bin/python dist/*.whl
    - uv pip check --python .artifact-venv/bin/python
    - .artifact-venv/bin/python -I tools/validate_artifact.py
    - .artifact-venv/bin/firex_blaze --help > /dev/null
    - .artifact-venv/bin/firex_flame --help > /dev/null
    - .artifact-venv/bin/firex_keeper --help > /dev/null

test-integration:
  stage: test
  script:
    # FlameLiveMonitorRemoteFile deliberately exercises Flame's SSH-based
    # remote log streaming against this container.
    - sudo /usr/sbin/sshd
    - uv run --locked --group integration firexapp submit --sync --chain nop
    - uv run --locked --group integration firexapp submit --chain RunAllIntegrationTests --public_runs True --install_configs cloud-ci-install-configs.json --sync --coverage False --max_parallel_tests 5
  artifacts:
    paths:
      - flow_test_results/
    when: always

upload-pkg:
  stage: upload
  dependencies:
    - build
  script:
    # Build already checked these exact artifacts; this job only publishes.
    - uv run --locked --group release twine upload --verbose --username __token__ dist/*
  only:
    - tags

upload-results:
  inherit:
    default: false
  stage: upload
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -e -r $firex_base_logging_dir  gs://runs.firexflame.com
  when: always

deploy-flame-ui:
  inherit:
    default: false
  stage: upload
  image: google/cloud-sdk
  dependencies:
    - build
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -r ci_artifacts/firex_flame_ui gs://www.firexstuff.com$DEPLOY_PATH
    - gsutil mv gs://www.firexstuff.com$DEPLOY_PATH/public-flame-ui-config.json gs://www.firexstuff.com$DEPLOY_PATH/flame-ui-config.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        DEPLOY_PATH: /flame/$CI_JOB_ID
    - if: $CI_COMMIT_TAG
      variables:
        DEPLOY_PATH: /flame

update-docs:
  inherit:
    default: false
  stage: update-docs
  image: google/cloud-sdk
  script:
    - gcloud auth activate-service-account --key-file $GOOGLE_APPLICATION_CREDENTIALS
    - gsutil -m rsync -r html gs://www.firexstuff.com/firexapp
  needs:
    - upload-pkg
    - build-docs
  only:
    - tags
