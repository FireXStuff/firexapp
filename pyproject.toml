[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "firexapp"
version = "5.7.168"
description = "Core firex application libraries"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Core FireX Team", email = "firex-dev@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "distlib",
    "confluent-kafka==2.12.0",
    "lxml",
    "tqdm<=4.29.1",
    "unittest-xml-reporting",
    "xunitmerge",
    "redis",
    "hiredis",
    "celery[redis]==5.3.1",
    "psutil",
    "python-Levenshtein",
    "entrypoints",
    "colorlog==2.10.0",
    "beautifulsoup4",
    "detach3k",
    "pytz",
    "rapidfuzz==3.8.1",
    "SQLAlchemy<2",
    "Flask==3.1.0",
    "Flask-AutoIndex==0.6.6",
    "Werkzeug==3.1.3",
    "python-socketio==5.3.0",
    "requests",
    "paramiko",
    "gevent-websocket",
    "gevent",
    "importlib-resources",
    "jsonpath-ng==1.7.0",
    "cryptography==42.0.7",
    "bcrypt==4.1.3",
    "jinja2",
    "pydantic==2.13.0",
    "typing-extensions==4.16.0",
]

[project.optional-dependencies]
test = []
flame = []

[project.urls]
Homepage = "https://github.com/FireXStuff/firexapp"

[project.scripts]
firexapp = "firexapp.application:main"
firex_blaze = "firex_blaze.__main__:main"
firex_flame = "firex_flame.__main__:main"
firex_keeper = "firex_keeper.__main__:main"
flow_tests = "firexapp.testing.test_infra:default_main"
firex_shutdown = "firexapp.submit.shutdown:main"

[project.entry-points."firex.core"]
firexapp = "firexapp"
firexkit = "firexkit"

[project.entry-points."firex.bundles"]
firex-bundle-ci = "firex_bundle_ci"

[project.entry-points."firex_tracking_service"]
firex_blaze_launcher = "firex_blaze.blaze_launcher:FireXBlazeLauncher"
firex_keeper_launcher = "firex_keeper.keeper_launcher:FireXKeeperLauncher"
flame_launcher = "firex_flame.launcher:FlameLauncher"

[dependency-groups]
test = [
    "coverage==5.5",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-sitemap",
]
integration = []

[tool.uv.build-backend]
module-root = ""
module-name = [
    "firexapp",
    "firexkit",
    "firex_blaze",
    "firex_bundle_ci",
    "firex_keeper",
    "firex_flame",
    "firex_flame_ui",
]
source-include = ["firex_flame_ui_frontend/**"]
source-exclude = [
    "/firex_flame_ui_frontend/dist",
    "/firex_flame_ui_frontend/node_modules",
]
wheel-exclude = ["firex_flame_ui/public-flame-ui-config.json"]

[tool.uv]
required-version = "==0.11.*"
