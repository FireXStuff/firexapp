[build-system]
requires = [
    "setuptools==84.0.0",
    "versioneer[toml]==0.29",
    "fastentrypoints==0.12",
    "tomli==2.4.1; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "firexapp"
dynamic = ["version"]
description = "Core firex application libraries"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Core FireX Team", email = "firex-dev@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "distlib",
    "confluent-kafka==2.12.0",
    "lxml",
    "tqdm<=4.29.1",
    "unittest-xml-reporting",
    "xunitmerge",
    "redis",
    "hiredis",
    "celery[redis]==5.3.1",
    "psutil",
    "python-Levenshtein",
    "entrypoints",
    "colorlog==2.10.0",
    "beautifulsoup4",
    "detach3k",
    "pytz",
    "rapidfuzz==3.8.1",
    "SQLAlchemy<2",
    "Flask==3.1.0",
    "Flask-AutoIndex==0.6.6",
    "Werkzeug==3.1.3",
    "python-socketio==5.3.0",
    "requests",
    "paramiko",
    "gevent-websocket",
    "gevent",
    "importlib-resources",
    "jsonpath-ng==1.7.0",
    "cryptography==42.0.7",
    "bcrypt==4.1.3",
    "jinja2",
    "pydantic==2.13.0",
    "typing-extensions==4.16.0",
]

[project.optional-dependencies]
test = []
flame = []

[project.urls]
Homepage = "https://github.com/FireXStuff/firexapp"

[project.scripts]
firexapp = "firexapp.application:main"
firex_blaze = "firex_blaze.__main__:main"
firex_flame = "firex_flame.__main__:main"
firex_keeper = "firex_keeper.__main__:main"
flow_tests = "firexapp.testing.test_infra:default_main"
firex_shutdown = "firexapp.submit.shutdown:main"

[project.entry-points."firex.core"]
firexapp = "firexapp"
firexkit = "firexkit"

[project.entry-points."firex.bundles"]
firex-bundle-ci = "firex_bundle_ci"

[project.entry-points."firex_tracking_service"]
firex_blaze_launcher = "firex_blaze.blaze_launcher:FireXBlazeLauncher"
firex_keeper_launcher = "firex_keeper.keeper_launcher:FireXKeeperLauncher"
flame_launcher = "firex_flame.launcher:FlameLauncher"

[dependency-groups]
test = [
    "coverage==5.5",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-sitemap",
]
integration = []
release = [
    "keyrings.alt",
    "twine",
]

[tool.setuptools]
include-package-data = true
zip-safe = true
# Preserve the legacy ``setup.py develop`` import-path behavior for editable
# installs.  Without an explicit root package directory, setuptools may use a
# meta-path finder for PEP 660 installs.  That finder runs after PathFinder and
# can be shadowed by stale package directories left by an in-place upgrade.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "firexapp*",
    "firexkit*",
    "firex_blaze*",
    "firex_bundle_ci*",
    "firex_keeper*",
    "firex_flame",
    "firex_flame.*",
    "firex_flame_ui",
]

[tool.setuptools.package-data]
firexkit = ["resources/*", "templates/*", "install_resources/*"]
firex_flame = ["templates/*.html"]
firex_flame_ui = ["*.html", "assets/*", "COMMITHASH", "VERSION"]

[tool.uv]
required-version = "==0.11.*"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "firexapp/_version.py"
versionfile_build = "firexapp/_version.py"
tag_prefix = ""
parentdir_prefix = "firexapp-"
